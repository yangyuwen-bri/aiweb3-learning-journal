<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI Concept Coach</title>
    <style>
      :root {
        --ink: #12100d;
        --paper: #f4efe3;
        --panel: #fffcf3;
        --line: #12100d;
        --muted: #6c665c;
        --mint: #66d7b0;
        --blue: #2f63d8;
        --red: #f06449;
        --yellow: #f5c84b;
        --shadow: 8px 8px 0 #12100d;
      }

      * {
        box-sizing: border-box;
      }

      [hidden] {
        display: none !important;
      }

      body {
        margin: 0;
        min-height: 100vh;
        color: var(--ink);
        background:
          linear-gradient(90deg, rgba(18, 16, 13, 0.06) 1px, transparent 1px),
          linear-gradient(rgba(18, 16, 13, 0.06) 1px, transparent 1px),
          var(--paper);
        background-size: 24px 24px;
        font-family: "Avenir Next", "PingFang SC", "Noto Sans SC", sans-serif;
        letter-spacing: 0;
      }

      button,
      textarea,
      input,
      select {
        font: inherit;
      }

      .app {
        width: min(1420px, calc(100vw - 28px));
        margin: 0 auto;
        padding: 26px 0 42px;
      }

      .top {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 340px;
        gap: 18px;
        align-items: end;
        margin-bottom: 18px;
      }

      .badge {
        display: inline-flex;
        width: fit-content;
        padding: 7px 10px;
        border: 2px solid var(--line);
        background: var(--yellow);
        box-shadow: 4px 4px 0 var(--line);
        font-size: 13px;
        font-weight: 900;
        text-transform: uppercase;
      }

      h1 {
        margin: 14px 0 8px;
        font-family: Georgia, "Songti SC", serif;
        font-size: clamp(42px, 7vw, 92px);
        line-height: 0.92;
      }

      .lead {
        max-width: 820px;
        margin: 0;
        color: #332f29;
        font-size: 18px;
        line-height: 1.7;
      }

      .status {
        border: 3px solid var(--line);
        background: var(--panel);
        box-shadow: var(--shadow);
        padding: 14px;
        font-size: 14px;
        line-height: 1.6;
      }

      .status strong {
        display: block;
        margin-bottom: 4px;
      }

      .layout {
        display: grid;
        grid-template-columns: 380px minmax(0, 1fr);
        gap: 18px;
        align-items: start;
      }

      .panel {
        border: 3px solid var(--line);
        background: rgba(255, 252, 243, 0.96);
        box-shadow: var(--shadow);
      }

      .panel-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 14px 16px;
        border-bottom: 3px solid var(--line);
        background: #fff;
      }

      .panel-title {
        margin: 0;
        font-size: 15px;
        font-weight: 900;
      }

      .counter {
        padding: 5px 8px;
        border: 2px solid var(--line);
        background: var(--blue);
        color: #fff;
        font-family: "Courier New", monospace;
        font-size: 12px;
        font-weight: 900;
      }

      .form {
        display: grid;
        gap: 14px;
        padding: 16px;
      }

      label {
        display: grid;
        gap: 7px;
        font-weight: 900;
      }

      .hint {
        color: var(--muted);
        font-size: 12px;
        font-weight: 700;
        line-height: 1.5;
      }

      textarea,
      input,
      select {
        width: 100%;
        border: 2px solid var(--line);
        background: #fff;
        color: var(--ink);
        padding: 11px;
        outline: 0;
        line-height: 1.5;
      }

      textarea:focus,
      input:focus,
      select:focus {
        box-shadow: 0 0 0 3px var(--mint);
      }

      textarea {
        min-height: 126px;
        resize: vertical;
      }

      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .chip,
      .btn {
        min-height: 40px;
        border: 2px solid var(--line);
        background: #fff;
        color: var(--ink);
        cursor: pointer;
        font-weight: 900;
        box-shadow: 4px 4px 0 var(--line);
        transition: transform 150ms ease, box-shadow 150ms ease, background 150ms ease;
      }

      .chip {
        padding: 8px 10px;
        font-size: 13px;
      }

      .btn {
        padding: 10px 14px;
      }

      .chip:hover,
      .btn:hover {
        transform: translate(2px, 2px);
        box-shadow: 2px 2px 0 var(--line);
      }

      .btn.primary {
        background: var(--mint);
      }

      .btn.warn {
        background: var(--red);
        color: #fff;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }

      .output {
        display: grid;
        gap: 14px;
        padding: 16px;
        min-height: 520px;
      }

      .empty {
        min-height: 520px;
        display: grid;
        place-items: center;
        padding: 32px;
        color: var(--muted);
        text-align: center;
        line-height: 1.7;
      }

      .section-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 14px;
      }

      .card {
        border: 2px solid var(--line);
        background: #fff;
        padding: 14px;
        min-height: 130px;
      }

      .card:nth-child(2n) {
        background: #eaf8ff;
      }

      .card:nth-child(3n) {
        background: #fff0e9;
      }

      .card-title {
        margin: 0 0 8px;
        font-size: 13px;
        font-weight: 900;
        text-transform: uppercase;
      }

      .card p,
      .card li {
        color: #302b24;
        line-height: 1.65;
      }

      .card p {
        margin: 0;
      }

      .card ul {
        margin: 0;
        padding-left: 20px;
      }

      .wide {
        grid-column: 1 / -1;
      }

      .score {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 46px;
        height: 34px;
        border: 2px solid var(--line);
        background: var(--yellow);
        font-weight: 900;
        margin-right: 8px;
      }

      .note {
        white-space: pre-wrap;
        font-family: "Courier New", "PingFang SC", monospace;
        font-size: 14px;
      }

      .toast {
        position: fixed;
        right: 22px;
        bottom: 22px;
        transform: translateY(120px);
        padding: 12px 14px;
        border: 2px solid var(--line);
        background: var(--mint);
        box-shadow: 5px 5px 0 var(--line);
        font-weight: 900;
        transition: transform 180ms ease;
        z-index: 20;
      }

      .toast.show {
        transform: translateY(0);
      }

      @media (max-width: 980px) {
        .top,
        .layout,
        .section-grid {
          grid-template-columns: 1fr;
        }
      }

      @media (max-width: 620px) {
        .app {
          width: min(100vw - 16px, 620px);
          padding-top: 14px;
        }

        .panel {
          box-shadow: 5px 5px 0 var(--line);
        }
      }
    </style>
  </head>
  <body>
    <main class="app">
      <header class="top">
        <div>
          <span class="badge">AI Learning Artifact</span>
          <h1>AI Concept Coach</h1>
          <p class="lead">把“我好像懂了”的 AI 概念，训练到能用自己的话讲清楚。输入困惑，生成解释；写下复述，再让 AI 给反馈。</p>
        </div>
        <aside class="status" id="serverStatus">
          <strong>Local model proxy</strong>
          正在检查本地服务...
        </aside>
      </header>

      <section class="layout">
        <aside class="panel">
          <div class="panel-head">
            <p class="panel-title">练习输入</p>
            <span class="counter">STEP 1</span>
          </div>
          <form class="form" id="coachForm">
            <label>
              你的 AI 概念困惑
              <textarea id="conceptInput" placeholder="例如：prompt、workflow 和 agent 到底有什么区别？"></textarea>
              <span class="hint">不要输入 API key、token、私钥、助记词或个人敏感信息。</span>
            </label>

            <div>
              <p class="card-title">常用练习题</p>
              <div class="chips">
                <button class="chip" type="button" data-prompt="Prompt、Workflow 和 Agent 有什么区别？">Prompt / Workflow / Agent</button>
                <button class="chip" type="button" data-prompt="LLM 和 Agent 有什么区别？">LLM vs Agent</button>
                <button class="chip" type="button" data-prompt="Human-in-the-loop 为什么重要？">Human-in-the-loop</button>
                <button class="chip" type="button" data-prompt="Tool use 在 Agent 里是什么意思？">Tool use</button>
                <button class="chip" type="button" data-prompt="为什么 AI 输出需要验证？">验证 AI 输出</button>
              </div>
            </div>

            <label>
              课程语境（可选）
              <input id="contextInput" value="AI x Web3 School Week 1：LLM、Prompt、Workflow、Agent、工具调用、人类确认边界。" />
            </label>

            <div class="actions">
              <button class="btn primary" type="submit" id="generateBtn">生成训练卡</button>
              <button class="btn" type="button" id="clearBtn">清空</button>
            </div>
          </form>

          <div class="panel-head">
            <p class="panel-title">你的复述</p>
            <span class="counter">STEP 2</span>
          </div>
          <form class="form" id="reviewForm">
            <label>
              用自己的话解释这个概念
              <textarea id="restatementInput" placeholder="先看解释，再用自己的话写 2-4 句。"></textarea>
            </label>
            <button class="btn warn" type="submit" id="reviewBtn">检查我的复述</button>
          </form>
        </aside>

        <section class="panel">
          <div class="panel-head">
            <p class="panel-title">AI 训练输出</p>
            <span class="counter" id="modelLabel">glm-5.1</span>
          </div>
          <div class="empty" id="emptyState">
            <p>输入一个概念困惑后，这里会生成解释、类比、自测问题和笔记草稿。这个工具不是替你学习，而是让你必须复述并修正自己的理解。</p>
          </div>
          <div class="output" id="output" hidden></div>
        </section>
      </section>
    </main>
    <div class="toast" id="toast">已复制</div>

    <script>
      const state = {
        lastConcept: "",
        lastContext: "",
        loading: false
      };

      const conceptInput = document.querySelector("#conceptInput");
      const contextInput = document.querySelector("#contextInput");
      const restatementInput = document.querySelector("#restatementInput");
      const output = document.querySelector("#output");
      const emptyState = document.querySelector("#emptyState");
      const toast = document.querySelector("#toast");

      document.querySelectorAll("[data-prompt]").forEach(button => {
        button.addEventListener("click", () => {
          conceptInput.value = button.dataset.prompt;
          conceptInput.focus();
        });
      });

      document.querySelector("#coachForm").addEventListener("submit", async event => {
        event.preventDefault();
        const concept = conceptInput.value.trim();
        const context = contextInput.value.trim();
        if (!concept) return showToast("先输入一个概念困惑");
        state.lastConcept = concept;
        state.lastContext = context;
        await requestCoach({ action: "coach", concept, context });
      });

      document.querySelector("#reviewForm").addEventListener("submit", async event => {
        event.preventDefault();
        const learnerAnswer = restatementInput.value.trim();
        if (!state.lastConcept) return showToast("先生成训练卡");
        if (!learnerAnswer) return showToast("先写下你的复述");
        await requestCoach({
          action: "review",
          concept: state.lastConcept,
          context: state.lastContext,
          learnerAnswer
        });
      });

      document.querySelector("#clearBtn").addEventListener("click", () => {
        conceptInput.value = "";
        restatementInput.value = "";
        output.hidden = true;
        output.innerHTML = "";
        emptyState.hidden = false;
      });

      checkServer();

      async function checkServer() {
        const status = document.querySelector("#serverStatus");
        try {
          const response = await fetch("/health");
          const data = await response.json();
          document.querySelector("#modelLabel").textContent = data.model || "glm-5.1";
          status.innerHTML = `<strong>Local model proxy</strong>${data.hasKey ? "已配置 API key，可以生成。" : "未检测到 API key，请配置 DASHSCOPE_API_KEY。"}`;
        } catch {
          status.innerHTML = "<strong>Local model proxy</strong>本地服务未启动。";
        }
      }

      async function requestCoach(payload) {
        setLoading(true);
        try {
          const response = await fetch("/api/coach", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
          });
          const data = await response.json();
          if (!response.ok || !data.ok) throw new Error(data.error || "生成失败");
          renderResult(data.action, data.result, data);
        } catch (error) {
          showToast(error.message || "请求失败");
        } finally {
          setLoading(false);
        }
      }

      function renderResult(action, result, meta) {
        emptyState.hidden = true;
        output.hidden = false;

        if (action === "review") {
          output.innerHTML = renderReview(result, meta);
          return bindCopy();
        }

        output.innerHTML = renderCoach(result, meta);
        bindCopy();
      }

      function renderCoach(result, meta) {
        return `
          <div class="section-grid">
            ${card("一句话解释", result.oneSentence)}
            ${card("不是这个", result.notThis)}
            ${card("新手类比", result.analogy)}
            ${card("学习场景", result.learningScenario)}
            ${listCard("相邻概念区别", (result.adjacentConcepts || []).map(item => `${item.name}：${item.difference}`))}
            ${listCard("常见误区", result.commonMistakes)}
            ${listCard("自测问题", result.selfCheckQuestions)}
            ${card("复述练习", result.restatementPrompt)}
            ${noteCard("学习笔记草稿", result.noteDraft)}
            ${listCard("人工验证点", result.humanVerification)}
          </div>
          <div class="hint">Model: ${escapeHTML(meta.model)} · Latency: ${meta.latencyMs}ms · AI 生成内容需要人工验证后再进入公开笔记。</div>
        `;
      }

      function renderReview(result, meta) {
        return `
          <div class="section-grid">
            <div class="card wide">
              <p class="card-title">复述评分</p>
              <p><span class="score">${escapeHTML(String(result.score ?? "-"))}/5</span> ${escapeHTML(result.verdict || "")}</p>
            </div>
            ${listCard("说对的部分", result.correctParts)}
            ${listCard("还不清楚的部分", result.unclearParts)}
            ${card("更准确的复述", result.improvedRestatement)}
            ${listCard("下一步练习", result.nextPractice)}
            ${noteCard("修正版笔记草稿", result.noteDraft)}
          </div>
          <div class="hint">Model: ${escapeHTML(meta.model)} · Latency: ${meta.latencyMs}ms · 反馈是学习建议，不是权威定义。</div>
        `;
      }

      function card(title, value) {
        return `
          <article class="card">
            <p class="card-title">${escapeHTML(title)}</p>
            <p>${escapeHTML(value || "暂无")}</p>
          </article>
        `;
      }

      function listCard(title, items) {
        const safeItems = Array.isArray(items) && items.length ? items : ["暂无"];
        return `
          <article class="card">
            <p class="card-title">${escapeHTML(title)}</p>
            <ul>${safeItems.map(item => `<li>${escapeHTML(item)}</li>`).join("")}</ul>
          </article>
        `;
      }

      function noteCard(title, value) {
        return `
          <article class="card wide">
            <p class="card-title">${escapeHTML(title)}</p>
            <p class="note">${escapeHTML(value || "暂无")}</p>
            <button class="btn" type="button" data-copy="${escapeHTML(value || "")}">复制笔记</button>
          </article>
        `;
      }

      function bindCopy() {
        document.querySelectorAll("[data-copy]").forEach(button => {
          button.addEventListener("click", async () => {
            await navigator.clipboard.writeText(button.dataset.copy || "");
            showToast("笔记已复制");
          });
        });
      }

      function setLoading(loading) {
        state.loading = loading;
        document.querySelector("#generateBtn").disabled = loading;
        document.querySelector("#reviewBtn").disabled = loading;
        document.querySelector("#generateBtn").textContent = loading ? "生成中..." : "生成训练卡";
        document.querySelector("#reviewBtn").textContent = loading ? "检查中..." : "检查我的复述";
      }

      function showToast(text) {
        toast.textContent = text;
        toast.classList.add("show");
        window.setTimeout(() => toast.classList.remove("show"), 1600);
      }

      function escapeHTML(value) {
        return String(value ?? "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }
    </script>
  </body>
</html>
